name :wf-cd-production
    on:
    push:
      branches:
-productoin
 jobs:
    upload-job-production:
     runs-on: ubuntu-latest
    steps:
        -name: Checkout Repo
      uses: actions/checkout@v4
          with:

               ref: "$((github.ref))"
        -name: Build Artifats with Parcel
        run: npx parcel Build "./src/index.html" --dist-dir "./dist" --public-url
        -name :Upload Build Artifacts 
        uses : actions /Upload-pages-artifact@v3
        with:
          path: "./dist"
        name: "build-artifact-production"
    deploy-job-production:
    needs:   "upload-job-production"
    runs on: ubuntu-latest
    Permission:
    pages:write
    id-token:write
    environment:
    name: "production-env"
  steps:
  - name: Deploy Build Artifacts on Git Pages
      uses: actions/deploy-pages@v4
      with:
      artifacts_name: "build-artifact-production" 
      token: "$((github.token))"

